<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ежедневные размышления — DRA</title>
  <meta name="description" content="DRA — Dual Recovery Anonymous. Зависимые в двойном выздоровлении. Расписание, группы, материалы и контакты.">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-current-page="daily-reflections.html">
<header class="site-header">
  <a class="brand" href="index.html" aria-label="DRA — на главную">
    <img src="assets/img/brand/dra-crest.png" alt="DRA Crest" class="brand-logo" width="560" height="570">
    <span class="brand-text" data-brand-text><strong>DRA</strong><small>Dual Recovery Anonymous</small></span>
  </a>
  <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Меню</button>
  <nav class="site-nav" id="site-nav" aria-label="Основная навигация" data-navigation></nav>
</header>
<main>
<section class="section-card">
  <p class="eyebrow">Ежедневник</p>
  <h1>Ежедневные размышления</h1>
  <p class="lead">По умолчанию открывается сегодняшняя дата по часовому поясу браузера. Даты без материала отображаются, но не кликабельны.</p>
</section>
<section class="section-card daily-layout">
  <article class="daily-card" data-daily-current></article>
  <aside class="calendar-card">
    <div class="daily-controls">
      <button type="button" class="button small" data-daily-prev>← Предыдущий</button>
      <button type="button" class="button small" data-daily-today>Сегодня</button>
      <button type="button" class="button small" data-daily-next>Следующий →</button>
    </div>
    <label class="month-select-label">Месяц
      <select data-daily-month></select>
    </label>
    <div class="mini-calendar" data-daily-calendar></div>
  </aside>
</section>
</main>
<footer class="site-footer">
  <div data-footer-brand>
    <strong>DRA</strong><br>
    <span>DUAL RECOVERY ANONYMOUS</span><br>
    <span>Зависимые в двойном выздоровлении</span>
  </div>
  <div class="footer-links" data-social-links></div>
</footer>
<script src="assets/js/main.js" defer></script>
</body>
</html>
