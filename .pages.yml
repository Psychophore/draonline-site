media:
  - name: images
    label: Изображения
    input: assets/img
    output: /assets/img
    categories: [image]
    rename: safe

content:
  - name: site
    label: Общие настройки сайта
    type: file
    path: data/site.json
    format: json
    fields:
      - { name: siteName, label: Название, type: string }
      - { name: subtitle, label: Английский подзаголовок, type: string }
      - { name: description, label: Описание, type: string }
      - { name: domain, label: Домен, type: string }
      - { name: slogan, label: Слоган, type: string }
      - { name: orientationText, label: Текст для кого сообщество, type: text }
      - { name: disclaimer, label: Дисклеймер, type: text }
      - name: socialLinks
        label: Контакты и соцсети
        type: object
        fields:
          - { name: telegram, label: Telegram, type: string }
          - { name: vk, label: VK, type: string }
          - { name: max, label: MAX, type: string }
          - { name: email, label: Email, type: string }


  - name: navigation
    label: Шапка и меню
    type: file
    path: data/navigation.json
    format: json
    list: true
    fields:
      - { name: id, label: ID, type: string }
      - { name: label, label: Текст пункта, type: string }
      - { name: url, label: Ссылка, type: string }
      - name: children
        label: Вложенные пункты
        type: object
        required: false
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - { name: id, label: ID, type: string, required: false }
          - { name: label, label: Текст пункта, type: string }
          - { name: url, label: Ссылка, type: string }

  - name: pages
    label: Тексты страниц
    type: file
    path: data/pages.json
    format: json
    fields:
      - name: home
        label: Главная
        type: object
        fields:
          - { name: title, label: Короткое название, type: string }
          - { name: subtitle, label: Английский подзаголовок, type: string }
          - { name: heading, label: Заголовок, type: string }
          - { name: lead, label: Лид, type: text }
          - { name: slogan, label: Слоган, type: string }
          - name: primaryButtons
            label: Кнопки главного экрана
            type: object
            list: true
            fields:
              - { name: label, label: Текст кнопки, type: string }
              - { name: url, label: Ссылка, type: string }
      - name: about
        label: О нас
        type: object
        fields:
          - { name: title, label: Название страницы, type: string }
          - { name: heading, label: Заголовок, type: string }
          - { name: lead, label: Лид, type: text }
          - name: sections
            label: Разделы
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{heading}"
            fields:
              - { name: heading, label: Заголовок раздела, type: string }
              - name: paragraphs
                label: Абзацы
                type: text
                list: true
      - name: groups
        label: Группы
        type: object
        fields:
          - { name: title, label: Название страницы, type: string }
          - { name: heading, label: Заголовок, type: string }
          - { name: lead, label: Лид, type: text }
      - name: materials
        label: Материалы
        type: object
        fields:
          - { name: title, label: Название страницы, type: string }
          - { name: lead, label: Лид, type: text }
      - name: speakers
        label: Спикерские
        type: object
        fields:
          - { name: title, label: Название страницы, type: string }
          - { name: lead, label: Лид, type: text }
      - name: contacts
        label: Контакты
        type: object
        fields:
          - { name: title, label: Название страницы, type: string }
          - { name: lead, label: Лид, type: text }

  - name: schedule
    label: Расписание
    type: file
    path: data/schedule.json
    format: json
    list: true
    fields:
      - name: id
        label: Служебный ID
        type: string
        required: true
        description: Только латиница, цифры и дефисы. Изменение ID создаёт новую запись для сайта.
        pattern:
          regex: '^[a-z0-9][a-z0-9-]*$'
          message: Используйте латинские строчные буквы, цифры и дефисы.
      - name: day
        label: День недели
        type: select
        required: true
        options:
          values: [Понедельник, Вторник, Среда, Четверг, Пятница, Суббота, Воскресенье]
      - name: weekday
        label: Номер дня недели
        type: number
        required: true
        description: Понедельник — 1, воскресенье — 7.
        options:
          min: 1
          max: 7
      - name: time
        label: Время
        type: string
        required: true
        pattern:
          regex: '^([01]\d|2[0-3]):[0-5]\d$'
          message: Укажите время в формате ЧЧ:ММ, например 20:00.
      - name: groupId
        label: Группа
        type: select
        required: true
        options:
          values:
            - { name: put-domoy, label: Путь домой }
            - { name: '129', label: '129' }
      - { name: groupName, label: Название группы, type: string, required: true }
      - { name: title, label: Название собрания, type: string, required: true }
      - name: format
        label: Формат
        type: select
        required: true
        options:
          values:
            - { name: online, label: Онлайн }
            - { name: offline, label: Офлайн }
            - { name: hybrid, label: Гибрид }
      - { name: formatLabel, label: Формат для сайта, type: string }
      - { name: city, label: Город, type: string, required: false }
      - { name: address, label: Адрес, type: string, required: false }
      - { name: room, label: Кабинет/комната, type: string, required: false }
      - name: onlineLinkKey
        label: Канал онлайн-подключения
        type: select
        required: false
        options:
          values:
            - { name: telegram, label: Telegram }
            - { name: vk, label: VK }
            - { name: max, label: MAX }
      - { name: note, label: Примечание, type: text, required: false }
      - { name: mapQuery, label: Адрес для карты, type: string, required: false }

  - name: groups
    label: Группы
    type: file
    path: data/groups.json
    format: json
    list: true
    fields:
      - { name: id, label: ID, type: string }
      - { name: name, label: Название, type: string }
      - { name: slug, label: Страница, type: string }
      - name: logo
        label: Логотип
        type: image
        options:
          media: images
          path: brand
          extensions: [png, jpg, jpeg, webp, svg]
          rename: safe
      - { name: shortDescription, label: Краткое описание, type: text }
      - { name: lead, label: Основной текст, type: text }
      - { name: format, label: Формат, type: string }
      - name: notes
        label: Заметки
        type: string
        list: true
      - name: news
        label: Новости группы
        type: object
        required: false
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - { name: date, label: Дата, type: date, required: false }
          - { name: title, label: Заголовок, type: string }
          - { name: text, label: Текст, type: text, required: false }
          - { name: url, label: Ссылка, type: string, required: false }
          - { name: urlLabel, label: Текст ссылки, type: string, required: false }

  - name: steps
    label: 12 шагов
    type: file
    path: data/steps.json
    format: json
    list: true
    fields:
      - { name: number, label: Номер шага, type: number }
      - { name: text, label: Текст шага, type: text }

  - name: materials
    label: Материалы
    type: file
    path: data/materials.json
    format: json
    list: true
    fields:
      - name: id
        label: Служебный ID
        type: string
        required: true
        pattern:
          regex: '^[a-z0-9][a-z0-9-]*$'
          message: Используйте латинские строчные буквы, цифры и дефисы.
      - { name: title, label: Название, type: string, required: true }
      - { name: description, label: Описание, type: text, required: true }
      - name: type
        label: Тип материала
        type: select
        required: true
        options:
          values:
            - { name: text, label: Текстовая страница }
            - { name: pdf, label: PDF }
            - { name: link, label: Внешняя ссылка }
            - { name: daily, label: Ежедневные размышления }
      - { name: url, label: URL, type: string }
      - { name: downloadUrl, label: URL скачивания, type: string, required: false }
      - { name: isFeatured, label: Важный материал, type: boolean, required: false }

  - name: daily-reflections
    label: Ежедневные размышления
    type: file
    path: data/daily-reflections.json
    format: json
    list: true
    fields:
      - { name: date, label: Дата MM-DD, type: string, pattern: '^(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$' }
      - { name: day, label: День, type: number }
      - { name: month, label: Месяц, type: number }
      - { name: title, label: Название, type: string }
      - { name: quote, label: Цитата, type: text, required: false }
      - { name: source, label: Источник, type: string, required: false }
      - name: body
        label: Абзацы
        type: text
        list: true
      - name: tags
        label: Теги
        type: string
        list: true
        required: false

  - name: speaker-recordings
    label: Спикерские
    type: file
    path: data/speaker-recordings.json
    format: json
    list: true
    fields:
      - name: id
        label: Служебный ID
        type: string
        required: true
        description: Только латиница, цифры и дефисы.
        pattern:
          regex: '^[a-z0-9][a-z0-9-]*$'
          message: Используйте латинские строчные буквы, цифры и дефисы.
      - { name: title, label: Название, type: string, required: true }
      - { name: date, label: Дата, type: date, required: true }
      - { name: speaker, label: Спикер, type: string, required: true }
      - { name: topic, label: Тема, type: string, required: true }
      - { name: group, label: Группа, type: string, required: false }
      - name: duration
        label: Длительность
        type: string
        required: false
        description: Например 48:15 или 1:12:30.
        pattern:
          regex: '^$|^(?:\d+:)?[0-5]?\d:[0-5]\d$'
          message: Используйте формат ММ:СС или Ч:ММ:СС.
      - name: audioUrl
        label: Ссылка на аудио (GitHub Releases)
        type: string
        required: true
        description: Публичный HTTPS-адрес release asset. Рекомендуется отдельный репозиторий Psychophore/draonline-media. Аудио не сохраняется в Git-истории сайта.
        pattern:
          regex: '^https://.+'
          message: Укажите полный HTTPS-адрес файла.
      - name: downloadUrl
        label: Отдельная ссылка для скачивания
        type: string
        required: false
        description: Оставьте пустым, если скачивание должно идти по той же ссылке, что и прослушивание.
        pattern:
          regex: '^$|^https://.+'
          message: Укажите полный HTTPS-адрес или оставьте поле пустым.
      - name: fileType
        label: MIME-тип
        type: select
        required: false
        options:
          values:
            - { name: audio/mpeg, label: MP3 — audio/mpeg }
            - { name: audio/mp4, label: M4A — audio/mp4 }
            - { name: audio/ogg, label: OGG — audio/ogg }
            - { name: audio/wav, label: WAV — audio/wav }
